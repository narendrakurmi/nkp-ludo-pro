<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NKP Ludo Pro Server</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;text-align:center;padding:50px;}
h1{color:#f59e0b;font-size:2.5rem;}
p{color:#94a3b8;font-size:1.1rem;}
.status{display:inline-block;padding:8px 20px;background:#10b981;color:#fff;border-radius:8px;font-weight:bold;margin:20px 0;}
.api{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:15px;margin:10px auto;max-width:500px;text-align:left;}
.api code{color:#f59e0b;}
</style>
</head>
<body>
<h1>🎲 NKP Ludo Pro Server</h1>
<div class="status">✅ Online</div>
<p>Server is running successfully</p>

<h3>APIs:</h3>
<div class="api"><code>GET /health</code> — Health check</div>
<div class="api"><code>GET /api/wake</code> — Wake-up ping</div>
<div class="api"><code>POST /api/razorpay/create-order</code> — Razorpay order</div>
<div class="api"><code>POST /api/razorpay/verify-payment</code> — Razorpay verify</div>
</body>
</html>
